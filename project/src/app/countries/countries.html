<div class="countries">
  <h2>Supported Countries</h2>
  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error">{{ error }}</div>
  <ul *ngIf="!loading && !error">
    <li *ngFor="let country of countries">
      {{ country.country_name }} (ID: {{ country.country_key }})
    </li>
  </ul>
</div>
